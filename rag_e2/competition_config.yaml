dataset:
  dataset_name: seekdb_competition
  dataset_path: ./data/dataset/  # Path to the PDF directory
  questions_path: ./data/questions.json
  output_path: ./data/output.json

llm:
  llm_name: qwen-flash  # Using API model name as placeholder, logic will handle this
  llm_path: qwen-flash  # For API calls, this might be the model name
  llm_device: cpu       # Device for local models, or irrelevant for API

paths:
  log_path: ./log
  answer_path: ./data/
  cache_path: ./cache
  processed_docs_path: ./processed_documents

cluster:
  chunk_length: 2000  # tiktoken 切分，无空格膨胀问题，可以更大
  overlap: 200  # chunk 之间的重叠 tokens
  merge_num: 3  # build_tree 合并节点数（3×2500=7500 tokens，安全）

retriever:
  kwargs:
    device: cpu
    shortest_path_k: 4
    debug: True
    merge_num: 5
    overlap: 100
    # tokenizer 已改用 tiktoken，不再需要本地 bert-base-chinese
    max_chunk_setting: 3  # 每个文档最多返回1个chunk（20 PDFs × 1 chunk = 安全）
    use_api_embedding: true  # 使用 API 嵌入而非本地模型
    embedding_model: text-embedding-v4  # 阿里云通义千问嵌入模型
    embedding_dim: 1024  # 嵌入维度
    embedder: text-embedding-v4  # 保持兼容性

vlm:
  worker_count: 100
  model_name: qwen3-vl-flash

graph:
  worker_count: 20  # 降低并发，避免过多 API 调用被限流（build_tree是API密集型）

query:
  max_concurrent_queries: 14  # 最多并行查询3个问题，避免触发速率限制
